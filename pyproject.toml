[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solomon-ai-orchestrator"
version = "0.4.0a0"
description = "Local, invisible multi-AI orchestration runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
solomon = "solomon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
