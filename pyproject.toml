[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octavryn-si"
version = "0.6.0a1"
description = "Octavryn SI: an extensible orchestration system for human and machine intelligence (formerly Solomon AI Orchestrator)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "mcp>=2.0",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
octavryn = "octavryn.cli:main"
# Deprecated compatibility alias retained through the v0.6 alpha line.
solomon = "solomon.cli:legacy_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"solomon.context" = ["schemas/*.json"]
