version: 0.4
# Token & Compute Intelligence Token Budget (v0.4 additional spec section 10 /
# Formal Specification v0.4 section 17.8). Parallel to usage_budget.example.yaml's
# USD-based budget -- this one is Token-scoped and multi-axis. The Router
# reads it as a token-pressure signal; a hard stop requires Human Approval.
budgets:
  global:
    # limit_tokens is a conservative placeholder the user should tune, not a
    # measured/researched figure -- same caveat as usage_budget.example.yaml's
    # limit_usd.
    limit_tokens: 2000000
    # window: all_time | daily | monthly. daily/monthly reset at the UTC
    # calendar boundary, computed fresh on every check (no scheduled job
    # resets anything).
    window: all_time
    warning_percent: 70
    critical_percent: 90
    hard_stop_percent: 100
  # Per-scope overrides. Each scope is optional; an unset scope/id falls back
  # to the global budget. { <scope_id>: { limit_tokens: N, window: daily } }
  scopes:
    project: {}
    agent: {}
    model: {}
    goal: {}
    task: {}
actions:
  warning: [log, dashboard_warning]
  critical: [prefer_lower_pressure_agent, compress_context, require_reason_for_expensive_route]
  hard_stop: [pause_or_request_approval]
